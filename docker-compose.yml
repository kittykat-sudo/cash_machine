services:
  db:
    image: postgres:16-alpine
    container_name: chathura_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-cash_register}
    ports:
      - "${HOST_DB_PORT:-5433}:5432"
    volumes:
      - chathura_postgres_data:/var/lib/postgresql/data
      - ./init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cash_register"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cash_network

  redis:
    image: redis:7-alpine
    container_name: chathura_redis
    restart: unless-stopped
    ports:
      - "${HOST_REDIS_PORT:-6380}:6379"
    volumes:
      - chathura_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cash_network

  backend:
    platform: linux/amd64
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: chathura_backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@db:5432/${POSTGRES_DB:-cash_register}
      REDIS_URL: redis://redis:6379/0
      JWT_SECRET: ${JWT_SECRET:-chathura-printers-super-secret-jwt-key-2026}
      ALLOWED_ORIGINS: "*"
      APP_TIMEZONE: ${APP_TIMEZONE:-Asia/Colombo}
      DEFAULT_CURRENCY: ${DEFAULT_CURRENCY:-LKR}
      SHOP_NAME: "Chathura Printers"
      SHOP_PHONE: ${SHOP_PHONE:-072 0129297 / 077-8683088}
      SHOP_WHATSAPP_NUMBER: ${SHOP_WHATSAPP_NUMBER:-0720129297}
      SHOP_ADDRESS: "No. 6A, Sri Hemananda Mw, Joolgaha, Galle"
      WHATSAPP_MODE: ${WHATSAPP_MODE:-click_to_chat}
      WHATSAPP_DEFAULT_COUNTRY_CODE: ${WHATSAPP_DEFAULT_COUNTRY_CODE:-94}
      WHATSAPP_API_TOKEN: ${WHATSAPP_API_TOKEN:-}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      TWILIO_WHATSAPP_NUMBER: ${TWILIO_WHATSAPP_NUMBER:-}
      WHATSAPP_BRIDGE_URL: ${WHATSAPP_BRIDGE_URL:-http://whatsapp-bridge:3001}
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cash_network

  whatsapp-bridge:
    platform: linux/amd64
    build:
      context: ./whatsapp-bridge
      dockerfile: Dockerfile
    container_name: chathura_whatsapp_bridge
    restart: unless-stopped
    environment:
      PORT: 3001
      AUTH_DIR: /app/auth_info_baileys
      SHOP_WHATSAPP_NUMBER: ${SHOP_WHATSAPP_NUMBER:-0720129297}
    ports:
      - "3001:3001"
    volumes:
      - chathura_whatsapp_auth:/app/auth_info_baileys
    networks:
      - cash_network

  frontend:
    platform: linux/amd64
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: chathura_frontend
    restart: unless-stopped
    environment:
      BACKEND_INTERNAL_URL: http://backend:8000
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - cash_network

volumes:
  chathura_postgres_data:
  chathura_redis_data:
  chathura_whatsapp_auth:

networks:
  cash_network:
    driver: bridge
